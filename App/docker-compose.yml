services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: zvitplus
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zvitplus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ZvitPlus.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=zvitplus;Username=postgres;Password=${DB_PASSWORD}"
      DataStorage__BasePath: /app/storage
      JwtSettings__Secret: ${JWT_SECRET}
      DisableHttpsRedirection: "true"
      SeedTestData: ${SEED_TEST_DATA:-false}
    volumes:
      - file-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./zvitplus.app
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
  file-storage: