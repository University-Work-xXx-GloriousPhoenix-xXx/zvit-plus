services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${DB_MEMORY_LIMIT_MB:-1024}
    ports:
      - "127.0.0.1:${DB_PORT:-1434}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ZvitPlus.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Production}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ZvitPlus;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      DataStorage__BasePath: /app/storage
      JwtSettings__Secret: ${JWT_SECRET}
      DisableHttpsRedirection: "true"
      SeedTestData: ${SEED_TEST_DATA:-false}
    volumes:
      - file-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./zvitplus.app
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  file-storage: